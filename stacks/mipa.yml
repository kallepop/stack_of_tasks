settings:
  actuator: !SOT_object:JointStatePublisherActuator {}
  rate: 50.0
  solver: !SOT_object:OSQPSolver {}
frames:
- &id003 !SOT_object:Offset
  frame: &id001 !SOT_object:MarkerFrame
    marker: &id002 !SOT_object:FullMovementMarker
      frame_id: base_footprint
      name: marker
      scale: 0.25
      transform: !SOT_transform {rpy: [1.5984972060935418, -0.03145037196036027, 1.7830770649891106],
        xyz: [0.5956230163574219, 0.002762019634246826, 0.5589422583580017]}
    name: marker
  name: goalR
  offset: !SOT_transform {rpy: [0.0, 0.0, 0.0], xyz: [0.0, 0.0, 0.0]}
- *id001
- &id004 !SOT_object:RobotRefFrame
  link_name: right_tcp
  name: curR
- &id005 !SOT_object:Offset
  frame: *id001
  name: goalL
  offset: !SOT_transform {rpy: [0.0, 0.0, 0.0], xyz: [0.0, 0.0, 0.0]}
- &id006 !SOT_object:RobotRefFrame
